<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김가네 주식 · 연결 없음</title>
  <style>
    :root { --bg: #fbf7f2; --text: #2a1d14; --muted: #8c6b55; --accent: #f26b1d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15110e; --text: #f4ebe3; --muted: #b49a87; --accent: #ff8a45; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: "Noto Sans KR", system-ui, sans-serif; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 16px 0 6px; font-size: 20px; }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
    button { height: 42px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/icons/icon-192.png" alt="">
    <h1>인터넷에 연결되지 않았어요</h1>
    <p>김가네 주식은 실시간 시세를 받아 와야 해서<br>연결된 뒤에 다시 열어 주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
