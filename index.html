body{background:#fef9ef;color:#222;font-size:13px}
.header{height:52px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}

.logo-icon{width:28px;height:28px;background:#ff7a00;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.nav{display:flex;gap:6px}
.nav a{padding:6px 12px;border-radius:20px;font-size:12px;text-decoration:none;color:#666;background:#f5f5f5}
.nav a.active{background:#222;color:#fff}
.container{max-width:1280px;margin:0 auto;padding:12px 16px}
.live-top{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#666;background:#fff;border:1px solid #eee;padding:4px 10px;border-radius:20px;margin-bottom:8px}

.title span{color:#ff7a00}
.black-bar{background:#222;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:8px}
.desc{font-size:11px;color:#888;line-height:1.4;margin-bottom:12px}
.charts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.chart{background:#fff;border:1px solid #eee;border-radius:12px;padding:12px}
.chart h3{font-size:11px;color:#666}
.chart .price{font-size:20px;font-weight:800;margin:6px 0}
.table-wrap{background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden}
.table-head{display:grid;grid-template-columns:150px 1fr 110px 110px 60px 200px 60px;gap:8px;padding:10px 12px;background:#fff6eb;font-size:11px;font-weight:700;color:#666;border-bottom:1px solid #eee}
.row{display:grid;grid-template-columns:150px 1fr 110px 110px 60px 200px 60px;gap:8px;padding:12px;border-bottom:1px solid #f5f5f5;align-items:center;background:#fff}
.name{font-weight:700;font-size:12px}
.tag-orange{background:#fff1e0;color:#ff7a00;padding:3px 7px;border-radius:10px;font-size:10px;font-weight:700;display:inline-block}
.tag-green{background:#e6f7ed;color:#0a7a2e;padding:3px 7px;border-radius:10px;font-size:10px;font-weight:700;display:inline-block}
.bar{width:60px;height:6px;background:#eee;border-radius:3px;display:inline-block;vertical-align:middle;overflow:hidden}
.bar div{height:100%;background:#ff9a3c}
.score{font-weight:700;font-size:12px;background:#fff1e0;color:#ff7a00;padding:4px 10px;border-radius:12px;display:inline-block}
.view-btn{border:1px solid #eee;padding:4px 10px;border-radius:20px;font-size:11px;color:#666;text-decoration:none;display:inline-block;background:#fff}
.footer{padding:16px;text-align:center;font-size:10px;color:#aaa}
