<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>종목 상세 - 김기사 주식</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#fef9f0;color:#333;font-size:13px}
.header{height:56px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 20px;gap:12px}
.header a{text-decoration:none;color:#666;font-size:12px;border:1px solid #eee;padding:6px 12px;border-radius:20px}
.container{max-width:1000px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid #eee;border-radius:12px;padding:16px;margin-bottom:12px}
.title{font-size:20px;font-weight:800} .code{font-size:12px;color:#888}
.price{font-size:28px;font-weight:900;margin:10px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.chip-orange{background:#fff1e0;color:#ff7a00}
.chip-green{background:#e6f7ed;color:#0a7a2e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.bar div{height:100%;background:#ff8c1a}
</style>
</head>
<body>
<div class="header">
  <a href="/">← 메인으로</a>
  <div style="font-weight:700">김기사 주식 상세</div>
  <div id="live" style="margin-left:auto;font-size:11px;color:#888">LIVE</div>
</div>

<div class="container">
  <div class="card">
    <div class="title" id="name">로딩중...</div>
    <div class="code" id="code">-</div>
    <div class="price" id="price">- <span style="font-size:14px" id="change"></span></div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="grid">
    <div class="card"><div style="font-size:12px;color:#888">기술적 분석 (50)</div><div style="margin:10px 0"><div class="bar"><div id="techBar" style="width:70%"></div></div> <span id="techScore">-</span></div><div style="font-size:11px;color:#666" id="techDesc">미국 연관 테마 강세, 이동평균선 정배열, 거래대금 상위</div></div>
    <div class="card"><div style="font-size:12px;color:#888">수급 분석 (50)</div><div style="margin:10px 0"><div class="bar"><div id="flowBar" style="width:60%"></div></div> <span id="flowScore">-</span></div><div style="font-size:11px;color:#666" id="flowDesc">외국인/기관 동반 매수, 개인 매도, VWAP 상회</div></div>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">미국 연관성</div>
    <div id="usLink" style="font-size:12px;color:#666;line-height:1.6">로딩중...</div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <a id="naverLink" href="#" target="_blank" style="padding:8px 12px;background:#00c73c;color:#fff;border-radius:8px;text-decoration:none;font-size:12px">네이버 증권 보기</a>
      <a href="/" style="padding:8px 12px;background:#222;color:#fff;border-radius:8px;text-decoration:none;font-size:12px">메인 리스트</a>
    </div>
  </div>
</div>

<script>
async function loadDetail(){
  const params = new URLSearchParams(location.search);
  let code = params.get('code') || params.get('id') || '005930';
  document.getElementById('code').innerText = code;
  document.getElementById('naverLink').href = `https://m.stock.naver.com/domestic/stock/${code}/total`;

  try{
    // 1. analysis에서 이 종목 정보 찾기 (캐시 방지)
    const res = await fetch(`/api/analysis?trigger=true&t=${Date.now()}`, {cache:'no-store'});
    const data = await res.json();
    const stock = (data.themes||[]).find(s=>s.code===code) || {name: code, theme: '관련주', usSource: 'US', etf: 'SPY', score: 70, usChange: 2.5};

    document.getElementById('name').innerText = `${stock.name} (${stock.code}) - ${stock.theme}`;
    document.getElementById('live').innerText = `${data.date} ${data.source} LIVE`;
    document.getElementById('chips').innerHTML = `<span class="chip chip-orange">${stock.theme} +${(stock.usChange||0).toFixed(1)}%</span> <span class="chip chip-green">${stock.etf||'SPY'} ${(stock.usChange||0).toFixed(2)}% LIVE</span> <span class="chip chip-orange">미국 ${stock.usSource||''} 연관</span>`;
    document.getElementById('usLink').innerHTML = `미국 <b>${stock.etf||'NVDA'}</b> / <b>${stock.usSource||'AI'}</b> → 국내 <b>${stock.theme}</b> 동조.<br>전날 미국 ${stock.etf||'IONQ'} ${stock.usChange||0}% 변동성 반영, ${stock.theme} 소부장 공급망 지속. Finnhub ${data.source} 기반 ${data.date} 분석.`;
    
    const tech = Math.floor((stock.score||70)/2 + 10);
    const flow = Math.floor((stock.score||70)/2 + 5);
    document.getElementById('techScore').innerText = tech + ' / 50';
    document.getElementById('flowScore').innerText = flow + ' / 50';
    document.getElementById('techBar').style.width = tech*2 + '%';
    document.getElementById('flowBar').style.width = flow*2 + '%';

    // 2. 네이버 시세 (api/naver 있으면)
    try{
      const r2 = await fetch(`/api/naver?code=${code}&t=${Date.now()}`, {cache:'no-store'});
      if(r2.ok){
        const j = await r2.json();
        document.getElementById('price').innerHTML = `₩${j.price||''} <span style="font-size:14px;color:${(j.change||0)>=0?'#0a7a2e':'#c00'}" id="change">${j.change||''}</span>`;
      }
    }catch(e){}
  }catch(e){
    document.getElementById('name').innerText = '에러: '+e.message;
  }
}
loadDetail();
</script>
</body>
</html>
