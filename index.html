<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>김기사 주식</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, sans-serif}
body{background:#f9f9f9;color:#222;font-size:14px}
.header{background:#fff;border-bottom:1px solid #eee;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:16px}
.container{max-width:1100px;margin:0 auto;padding:16px}
.title{font-size:20px;font-weight:700;margin:16px 0 8px}
.sub{font-size:12px;color:#666;margin-bottom:16px;background:#fff;padding:10px;border-radius:8px;border:1px solid #eee}
.indices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.card{background:#fff;border:1px solid #eee;border-radius:8px;padding:12px}
.card h3{font-size:12px;color:#666} .card .price{font-size:18px;font-weight:700;margin:4px 0}
.card .chg{font-size:11px}
.us-top{background:#333;color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:12px}
.table-head{background:#ff8c1a;color:#fff;padding:10px 12px;border-radius:8px 8px 0 0;display:grid;grid-template-columns:120px 1fr 80px 80px;font-size:12px}
.table{background:#fff;border:1px solid #eee;border-radius:0 0 8px 8px}
.row{display:grid;grid-template-columns:120px 1fr 80px 80px;gap:8px;padding:12px;border-bottom:1px solid #f2f2f2;align-items:center;font-size:12px}
.row:last-child{border:none}
.tag{background:#fff1e0;color:#ff6b00;padding:2px 6px;border-radius:10px;font-size:10px;display:inline-block}
.badge{font-size:10px;color:#666}
</style>
</head>
<body>
<div class="header">
  <div class="logo">김기사 주식</div>
  <div style="font-size:11px;color:#666"><span id="liveBadge">LIVE</span> <span id="kstTime"></span></div>
</div>

<div class="container">
  <div class="title">오늘의 선물 시황과 미국 연관주</div>
  <div class="sub" id="subText">로딩중...</div>

  <div class="indices">
    <div class="card"><h3>S&P500</h3><div class="price" id="spyPrice">-</div><div class="chg" id="spyChg">-</div></div>
    <div class="card"><h3>나스닥</h3><div class="price" id="qqqPrice">-</div><div class="chg" id="qqqChg">-</div></div>
    <div class="card"><h3>KOSPI(EWY)</h3><div class="price" id="ewyPrice">-</div><div class="chg" id="ewyChg">-</div></div>
  </div>

  <div class="us-top" id="usTop">미국 테마 로딩중...</div>

  <div class="table-head">
    <div>종목 / 테마</div><div>관련 테마</div><div>기술적</div><div>수급</div>
  </div>
  <div class="table" id="stockTable">
    <div style="padding:20px;text-align:center;color:#888">데이터 불러오는 중...</div>
  </div>
</div>

<script>
async function loadAll(){
  document.getElementById('kstTime').innerText = new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});
  try{
    const res = await fetch(`/api/analysis?trigger=true&t=${Date.now()}`, {cache:'no-store'});
    const data = await res.json();
    
    document.getElementById('liveBadge').innerText = data.date + ' ' + data.source;
    document.getElementById('subText').innerText = data.date + ' | ' + (data.usThemes||[]).join(', ') + ' | ' + (data.newsSample||'').slice(0,150);
    
    const q = data.quotes || {};
    function setPrice(idP, idC, sym){
      const d = q[sym];
      if(!d) return;
      document.getElementById(idP).innerText = d.c ? d.c.toFixed(2) : '-';
      document.getElementById(idC).innerText = (d.dp>0?'+':'') + (d.dp||0).toFixed(2) + '%';
    }
    setPrice('spyPrice','spyChg','SPY');
    setPrice('qqqPrice','qqqChg','QQQ');
    setPrice('ewyPrice','ewyChg','EWY');

    document.getElementById('usTop').innerText = '미국 발: ' + (data.usThemes||[]).join(', ') + ' → 한국';

    const table = document.getElementById('stockTable');
    table.innerHTML = '';
    const seen = new Set();
    for(const s of (data.themes||[])){
      if(seen.has(s.code)) continue;
      seen.add(s.code);
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div><b>${s.name}</b><br><span class="badge">${s.code} ${s.theme}</span></div>
        <div><span class="tag">${s.usSource||''} ${s.etf||''} ${(s.usChange||0).toFixed(1)}%</span><br><span class="badge">${s.theme}</span></div>
        <div>${Math.floor((s.score||70)/2)}</div>
        <div>${Math.floor((s.score||70)/2)}</div>
      `;
      row.onclick = ()=> window.open('https://m.stock.naver.com/domestic/stock/'+s.code+'/total','_blank');
      table.appendChild(row);
    }
  }catch(e){
    document.getElementById('stockTable').innerHTML = '에러: '+e.message;
  }
}
loadAll();
setInterval(loadAll, 300000);
</script>
</body>
</html>
