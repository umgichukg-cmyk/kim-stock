
<!DOCTYPE html>
<html lang="en">
<head>
<script>
// 실시간 라이브 - 비동기 + 캐시, 실패해도 화면은 뜸
try{
  window.__ANALYSIS_LIVE__ = null;
  window.__K2_LIVE__ = null;
  // 캐시된 데이터 먼저 사용 (로컬에서도 보이게)
  try{
    var cached = localStorage.getItem('analysis_live_v2');
    if(cached){
      var cdata = JSON.parse(cached);
      window.__ANALYSIS_LIVE__ = cdata;
      console.log('[CACHE] live data', cdata.date);
    }
  }catch(e){}
  // 비동기 fetch - Vercel에서만 성공, 로컬에선 실패해도 무시
  fetch('/api/analysis?trigger=true&t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(data){
      try{
        window.__ANALYSIS_LIVE__ = data;
        localStorage.setItem('analysis_live_v2', JSON.stringify(data));
        console.log('[LIVE] fetched', data.date, data.usThemes, data.source);
        // k2 재구성
        if(data && data.themes){
          var map = {};
          data.themes.forEach(function(t){
            var th = t.theme;
            if(!map[th]) map[th]={kr:[], us:[t.etf||"NVDA"], vol:(t.score? t.score/20 : 4)};
            if(map[th].kr.length<4) map[th].kr.push(t.name);
          });
          var k2=[];
          Object.keys(map).forEach(function(th){
            var e=map[th];
            var vol=e.vol||3;
            if(vol<1) vol=2;
            k2.push({theme:th, vol:vol, us:e.us, kr:e.kr});
          });
          k2.sort(function(a,b){return b.vol - a.vol;});
          if(k2.length>0){
            window.__K2_LIVE__ = k2;
            // 새로 들어온 데이터면 1회 리로드로 반영 (중복 리로드 방지)
            var lastDate = localStorage.getItem('last_live_date');
            if(lastDate !== data.date){
              localStorage.setItem('last_live_date', data.date);
              if(!sessionStorage.getItem('live_reloaded')){
                sessionStorage.setItem('live_reloaded','1');
                console.log('[LIVE] new date, reload');
                location.reload();
              }
            }
          }
        }
      }catch(e){ console.log('live parse fail', e); }
    })
    .catch(function(e){ console.log('live fetch fail (local file에서는 정상)', e); });
}catch(e){ console.log('live init fail', e); }
</script>
